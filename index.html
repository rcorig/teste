<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rush to the Toilet!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }

        #gameWrapper {
            position: relative;
        }

        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 600px;
            padding: 10px 20px;
            background: #16213e;
            border: 2px solid #e94560;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            color: #eee;
            font-size: 16px;
        }

        .timer { color: #e94560; font-weight: bold; font-size: 20px; }
        .level-indicator { font-size: 14px; color: #4ecca3; }

        .urgency-bar {
            width: 200px; height: 16px;
            background: #333; border-radius: 8px;
            overflow: hidden; border: 1px solid #555;
        }

        .urgency-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecca3, #e9d962, #e94560);
            border-radius: 8px;
            width: 0%;
        }

        canvas {
            border: 2px solid #e94560;
            display: block;
            background: #0f3460;
        }

        #controls {
            width: 600px; padding: 8px;
            background: #16213e;
            border: 2px solid #e94560;
            border-top: none;
            border-radius: 0 0 10px 10px;
            color: #888; font-size: 12px;
            text-align: center;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            border-radius: 10px;
        }

        #overlay.hidden { display: none; }

        #overlay h1 { font-size: 36px; color: #e94560; margin-bottom: 10px; text-align: center; }
        #overlay h2 { font-size: 22px; color: #e9d962; margin-bottom: 20px; text-align: center; }

        #overlay .subtitle {
            font-size: 14px; color: #aaa;
            margin-bottom: 30px; text-align: center;
            max-width: 400px; line-height: 1.5;
        }

        #overlay .score-display { font-size: 18px; color: #4ecca3; margin-bottom: 20px; }

        #overlay button {
            padding: 12px 40px; font-size: 18px;
            font-family: 'Courier New', monospace;
            background: #e94560; color: white;
            border: none; border-radius: 8px;
            cursor: pointer;
        }

        #overlay button:hover { background: #c73650; }
    </style>
</head>
<body>
    <div id="gameWrapper">
        <div id="hud">
            <div><span class="level-indicator">Level: <span id="levelDisplay">1</span></span></div>
            <div><span>Time: </span><span id="timerDisplay" class="timer">30s</span></div>
            <div class="urgency-bar"><div id="urgencyFill" class="urgency-fill"></div></div>
            <div>Score: <span id="scoreDisplay">0</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="controls">Arrow Keys / WASD to move | Dodge the cars | Reach the toilet in time!</div>

        <div id="overlay">
            <h1 id="overlayTitle">Rush to the Toilet!</h1>
            <h2 id="overlaySubtitle">A Desperate Dash</h2>
            <p class="subtitle" id="overlayDesc">
                You ate some sketchy street food and now you REALLY need to go!
                Cross the busy roads, dodge traffic, and reach the toilet before time runs out!
            </p>
            <div class="score-display" id="overlayScore"></div>
            <button id="startBtn" onclick="onStartClick()">START</button>
        </div>
    </div>

    <script>
    // ===================== SETUP =====================
    var canvas = document.getElementById('gameCanvas');
    var ctx = canvas.getContext('2d');
    var overlay = document.getElementById('overlay');
    var overlayTitle = document.getElementById('overlayTitle');
    var overlaySubtitle = document.getElementById('overlaySubtitle');
    var overlayDesc = document.getElementById('overlayDesc');
    var overlayScore = document.getElementById('overlayScore');
    var startBtn = document.getElementById('startBtn');
    var timerDisplay = document.getElementById('timerDisplay');
    var urgencyFill = document.getElementById('urgencyFill');
    var scoreDisplay = document.getElementById('scoreDisplay');
    var levelDisplay = document.getElementById('levelDisplay');

    var W = 600;
    var H = 600;
    var TILE = 50;
    var COLS = W / TILE;
    var ROWS = H / TILE;

    var gameState = 'menu';
    var score = 0;
    var level = 1;
    var timeLeft = 30;
    var timerInterval = null;
    var animFrame = null;
    var frameCount = 0;
    var lanes = [];
    var particles = [];
    var keys = {};
    var moveDelay = 0;
    var MOVE_COOLDOWN = 8;

    var player = { x: 6, y: 11, desperationLevel: 0 };

    // ===================== HELPERS =====================

    function drawRoundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.arcTo(x + w, y, x + w, y + r, r);
        ctx.lineTo(x + w, y + h - r);
        ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
        ctx.lineTo(x + r, y + h);
        ctx.arcTo(x, y + h, x, y + h - r, r);
        ctx.lineTo(x, y + r);
        ctx.arcTo(x, y, x + r, y, r);
        ctx.closePath();
    }

    function drawOval(cx, cy, rx, ry) {
        ctx.beginPath();
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(rx, ry);
        ctx.arc(0, 0, 1, 0, Math.PI * 2);
        ctx.restore();
    }

    function getRandomCarColor() {
        var colors = ['#e94560', '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff8c00', '#9b59b6', '#1abc9c'];
        return colors[Math.floor(Math.random() * colors.length)];
    }

    function shadeColor(color, percent) {
        var num = parseInt(color.replace('#', ''), 16);
        var amt = Math.round(2.55 * percent);
        var R = Math.max(0, Math.min(255, (num >> 16) + amt));
        var G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
        var B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
        return 'rgb(' + R + ',' + G + ',' + B + ')';
    }

    // ===================== GAME LOGIC =====================

    function getLaneConfigs(lvl) {
        var configs = [];
        var baseSpeed = 1.2 + (lvl - 1) * 0.3;

        configs.push({ row: 0, type: 'safe', color: '#2d6a4f' });
        configs.push({ row: 1, type: 'grass', color: '#386641' });
        configs.push({ row: 2, type: 'road', speed: baseSpeed, direction: 1, spawnRate: 0.008 + lvl * 0.002, carWidth: 2, color: '#333333' });
        configs.push({ row: 3, type: 'road', speed: baseSpeed + 0.5, direction: -1, spawnRate: 0.01 + lvl * 0.002, carWidth: 1.5, color: '#3a3a3a' });
        configs.push({ row: 4, type: 'road', speed: baseSpeed + 0.3, direction: 1, spawnRate: 0.009 + lvl * 0.002, carWidth: 2.5, color: '#333333' });
        configs.push({ row: 5, type: 'safe', color: '#4a5568' });
        configs.push({ row: 6, type: 'road', speed: baseSpeed + 1, direction: -1, spawnRate: 0.012 + lvl * 0.003, carWidth: 2, color: '#3a3a3a' });
        configs.push({ row: 7, type: 'road', speed: baseSpeed + 0.8, direction: 1, spawnRate: 0.01 + lvl * 0.002, carWidth: 1.5, color: '#333333' });
        configs.push({ row: 8, type: 'grass', color: '#386641' });
        configs.push({ row: 9, type: 'road', speed: baseSpeed + 1.5, direction: -1, spawnRate: 0.015 + lvl * 0.003, carWidth: 2, color: '#3a3a3a' });
        configs.push({ row: 10, type: 'road', speed: baseSpeed + 0.6, direction: 1, spawnRate: 0.008 + lvl * 0.002, carWidth: 3, color: '#333333' });
        configs.push({ row: 11, type: 'safe', color: '#4a5568' });

        return configs;
    }

    function initLevel() {
        lanes = [];
        var configs = getLaneConfigs(level);

        for (var i = 0; i < configs.length; i++) {
            var config = configs[i];
            var lane = {
                row: config.row,
                type: config.type,
                cars: [],
                speed: config.speed || 0,
                direction: config.direction || 1,
                spawnRate: config.spawnRate || 0,
                carWidth: config.carWidth || 2,
                color: config.color
            };

            if (lane.type === 'road') {
                var numCars = Math.floor(Math.random() * 2) + 1;
                for (var j = 0; j < numCars; j++) {
                    lane.cars.push({
                        x: Math.random() * W,
                        width: lane.carWidth * TILE,
                        color: getRandomCarColor()
                    });
                }
            }

            lanes.push(lane);
        }

        player.x = Math.floor(COLS / 2);
        player.y = ROWS - 1;
        player.desperationLevel = 0;
        timeLeft = Math.max(15, 35 - (level - 1) * 3);
    }

    function onStartClick() {
        if (gameState === 'lose') {
            score = 0;
            level = 1;
        }
        startGame();
    }

    function startGame() {
        gameState = 'playing';
        overlay.className = 'hidden';
        particles = [];
        initLevel();

        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(function() {
            if (gameState !== 'playing') return;
            timeLeft -= 1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                gameOver('time');
            }
            updateHUD();
        }, 1000);

        if (animFrame) cancelAnimationFrame(animFrame);
        gameLoop();
    }

    function updateHUD() {
        timerDisplay.textContent = timeLeft + 's';
        if (timeLeft <= 5) {
            timerDisplay.style.animation = 'blink 0.3s infinite alternate';
        } else {
            timerDisplay.style.animation = '';
        }
        var urgency = Math.min(100, ((30 - timeLeft) / 30) * 100 + player.desperationLevel * 10);
        urgencyFill.style.width = urgency + '%';
        scoreDisplay.textContent = score;
        levelDisplay.textContent = level;
    }

    function gameOver(reason) {
        gameState = 'lose';
        if (timerInterval) clearInterval(timerInterval);

        overlay.className = '';
        if (reason === 'time') {
            overlayTitle.textContent = 'Too Late!';
            overlaySubtitle.textContent = "You didn't make it in time...";
            overlayDesc.textContent = 'The situation became... unsalvageable. Those street tacos were a mistake.';
        } else {
            overlayTitle.textContent = 'SPLAT!';
            overlaySubtitle.textContent = 'Hit by a car!';
            overlayDesc.textContent = "You got flattened by traffic! At least you don't need the toilet anymore...";
        }
        overlayScore.textContent = 'Final Score: ' + score;
        startBtn.textContent = 'TRY AGAIN';

        for (var i = 0; i < 30; i++) {
            particles.push({
                x: player.x * TILE + TILE / 2,
                y: player.y * TILE + TILE / 2,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 60,
                color: reason === 'time' ? '#8B4513' : '#e94560',
                size: Math.random() * 6 + 2
            });
        }
    }

    function winLevel() {
        gameState = 'win';
        if (timerInterval) clearInterval(timerInterval);

        var timeBonus = timeLeft * 10;
        var levelBonus = level * 50;
        score += timeBonus + levelBonus;

        overlay.className = '';
        overlayTitle.textContent = 'SWEET RELIEF!';
        overlaySubtitle.textContent = 'Level ' + level + ' Complete!';
        overlayDesc.textContent = 'You made it to the toilet just in time! The relief is immeasurable. But wait... your stomach is rumbling again!';
        overlayScore.textContent = 'Time Bonus: ' + timeBonus + ' | Level Bonus: ' + levelBonus + ' | Total: ' + score;
        startBtn.textContent = 'NEXT LEVEL';
        level++;

        for (var i = 0; i < 40; i++) {
            particles.push({
                x: W / 2, y: TILE,
                vx: (Math.random() - 0.5) * 10,
                vy: -Math.random() * 5 - 2,
                life: 80,
                color: ['#4ecca3', '#e9d962', '#4d96ff', '#ff6b6b'][Math.floor(Math.random() * 4)],
                size: Math.random() * 5 + 2
            });
        }
    }

    function movePlayer(dx, dy) {
        if (gameState !== 'playing' || moveDelay > 0) return;
        var nx = player.x + dx;
        var ny = player.y + dy;
        if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
            player.x = nx;
            player.y = ny;
            moveDelay = MOVE_COOLDOWN;
            if (player.y === 0) winLevel();
            player.desperationLevel = Math.min(10, (ROWS - player.y) / ROWS * 10);
        }
    }

    function updateCars() {
        for (var l = 0; l < lanes.length; l++) {
            var lane = lanes[l];
            if (lane.type !== 'road') continue;

            for (var i = lane.cars.length - 1; i >= 0; i--) {
                var car = lane.cars[i];
                car.x += lane.speed * lane.direction;
                if (lane.direction > 0 && car.x > W + car.width) {
                    lane.cars.splice(i, 1);
                } else if (lane.direction < 0 && car.x + car.width < -car.width) {
                    lane.cars.splice(i, 1);
                }
            }

            if (Math.random() < lane.spawnRate) {
                var carW = lane.carWidth * TILE;
                var x = lane.direction > 0 ? -carW : W + carW;
                var tooClose = false;
                for (var c = 0; c < lane.cars.length; c++) {
                    if (Math.abs(lane.cars[c].x - x) < carW * 2) { tooClose = true; break; }
                }
                if (!tooClose) {
                    lane.cars.push({ x: x, width: carW, color: getRandomCarColor() });
                }
            }
        }
    }

    function checkCollisions() {
        if (gameState !== 'playing') return;
        var px = player.x * TILE;
        var py = player.y * TILE;
        var ps = TILE - 6;

        for (var l = 0; l < lanes.length; l++) {
            var lane = lanes[l];
            if (lane.type !== 'road' || lane.row !== player.y) continue;
            for (var i = 0; i < lane.cars.length; i++) {
                var car = lane.cars[i];
                if (px + 3 < car.x + car.width &&
                    px + ps > car.x &&
                    py + 3 < lane.row * TILE + TILE &&
                    py + ps > lane.row * TILE) {
                    gameOver('hit');
                    return;
                }
            }
        }
    }

    function updateParticles() {
        for (var i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    // ===================== DRAWING =====================

    function drawBackground() {
        for (var l = 0; l < lanes.length; l++) {
            var lane = lanes[l];
            var y = lane.row * TILE;

            ctx.fillStyle = lane.color || '#333';
            ctx.fillRect(0, y, W, TILE);

            if (lane.type === 'road') {
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1;
                ctx.setLineDash([15, 15]);
                ctx.beginPath();
                ctx.moveTo(0, y + TILE / 2);
                ctx.lineTo(W, y + TILE / 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            if (lane.type === 'grass') {
                ctx.fillStyle = 'rgba(82,183,136,0.4)';
                for (var gx = 0; gx < W; gx += 20) {
                    var gh = 5 + Math.sin(gx * 0.3 + frameCount * 0.05) * 3;
                    ctx.fillRect(gx, y + TILE - gh, 3, gh);
                }
            }
        }

        // Labels
        ctx.font = '10px Courier New';
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillText('START', 10, 11 * TILE + 30);
        ctx.fillText('MEDIAN', 10, 5 * TILE + 30);
    }

    function drawToilet() {
        var tx = Math.floor(COLS / 2) * TILE;

        // Bowl
        ctx.fillStyle = '#ffffff';
        drawRoundedRect(tx + 5, 10, 40, 35, 5);
        ctx.fill();
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Tank
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(tx + 10, 2, 30, 12);
        ctx.strokeStyle = '#cccccc';
        ctx.strokeRect(tx + 10, 2, 30, 12);

        // Seat
        ctx.fillStyle = '#e0e0e0';
        drawOval(tx + 25, 30, 15, 10);
        ctx.fill();
        ctx.strokeStyle = '#bbbbbb';
        ctx.stroke();

        // Handle
        ctx.fillStyle = '#999999';
        ctx.fillRect(tx + 38, 5, 8, 3);

        // Pulsing glow
        if (gameState === 'playing') {
            var pulse = Math.sin(frameCount * 0.1) * 0.3 + 0.5;
            ctx.fillStyle = 'rgba(78, 204, 163, ' + (pulse * 0.3) + ')';
            ctx.beginPath();
            ctx.arc(tx + 25, 25, 35, 0, Math.PI * 2);
            ctx.fill();
        }

        // Arrow
        if (gameState === 'playing' && frameCount % 60 < 40) {
            ctx.fillStyle = '#4ecca3';
            ctx.beginPath();
            ctx.moveTo(tx + 25, TILE + 5);
            ctx.lineTo(tx + 15, TILE + 15);
            ctx.lineTo(tx + 35, TILE + 15);
            ctx.closePath();
            ctx.fill();
        }
    }

    function drawCars() {
        for (var l = 0; l < lanes.length; l++) {
            var lane = lanes[l];
            if (lane.type !== 'road') continue;

            for (var i = 0; i < lane.cars.length; i++) {
                var car = lane.cars[i];
                var cy = lane.row * TILE;
                var carH = TILE - 8;

                // Body
                ctx.fillStyle = car.color;
                drawRoundedRect(car.x, cy + 4, car.width, carH, 6);
                ctx.fill();

                // Roof
                ctx.fillStyle = shadeColor(car.color, -30);
                drawRoundedRect(car.x + car.width * 0.2, cy + 8, car.width * 0.6, carH - 12, 4);
                ctx.fill();

                // Headlights
                ctx.fillStyle = '#ffd93d';
                if (lane.direction > 0) {
                    ctx.fillRect(car.x + car.width - 6, cy + 8, 5, 5);
                    ctx.fillRect(car.x + car.width - 6, cy + carH - 5, 5, 5);
                } else {
                    ctx.fillRect(car.x + 1, cy + 8, 5, 5);
                    ctx.fillRect(car.x + 1, cy + carH - 5, 5, 5);
                }

                // Wheels
                ctx.fillStyle = '#222222';
                ctx.fillRect(car.x + 8, cy + 2, 10, 5);
                ctx.fillRect(car.x + 8, cy + carH + 1, 10, 5);
                ctx.fillRect(car.x + car.width - 18, cy + 2, 10, 5);
                ctx.fillRect(car.x + car.width - 18, cy + carH + 1, 10, 5);
            }
        }
    }

    function drawPlayer() {
        if (gameState === 'lose') return;

        var px = player.x * TILE;
        var py = player.y * TILE;

        var wiggleX = gameState === 'playing' ? Math.sin(frameCount * 0.3) * (player.desperationLevel * 0.5) : 0;
        var wiggleY = gameState === 'playing' ? Math.cos(frameCount * 0.4) * (player.desperationLevel * 0.3) : 0;

        var cx = px + TILE / 2 + wiggleX;
        var cy = py + TILE / 2 + wiggleY;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        drawOval(cx, cy + 18, 14, 5);
        ctx.fill();

        // Body
        ctx.fillStyle = '#4ecca3';
        ctx.beginPath();
        ctx.arc(cx, cy + 4, 12, 0, Math.PI * 2);
        ctx.fill();

        // Head
        ctx.fillStyle = '#f4c67a';
        ctx.beginPath();
        ctx.arc(cx, cy - 10, 10, 0, Math.PI * 2);
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#333333';
        ctx.beginPath();
        ctx.arc(cx - 4, cy - 12, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(cx + 4, cy - 12, 2, 0, Math.PI * 2);
        ctx.fill();

        // Mouth
        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        if (player.desperationLevel > 7) {
            ctx.arc(cx, cy - 6, 4, 0, Math.PI * 2);
        } else if (player.desperationLevel > 4) {
            ctx.arc(cx, cy - 4, 3, Math.PI, 0);
        } else {
            ctx.moveTo(cx - 3, cy - 6);
            ctx.lineTo(cx + 3, cy - 6);
        }
        ctx.stroke();

        // Sweat
        if (player.desperationLevel > 3 && frameCount % 20 < 15) {
            ctx.fillStyle = '#74b9ff';
            ctx.beginPath();
            ctx.arc(cx + 12, cy - 8 + (frameCount % 20) * 0.5, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Desperate legs
        if (player.desperationLevel > 6) {
            ctx.strokeStyle = '#4ecca3';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cx - 3, cy + 14);
            ctx.lineTo(cx - 1, cy + 22);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(cx + 3, cy + 14);
            ctx.lineTo(cx + 1, cy + 22);
            ctx.stroke();
        }
    }

    function drawParticles() {
        for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            ctx.globalAlpha = p.life / 80;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    // ===================== GAME LOOP =====================

    function gameLoop() {
        frameCount++;
        if (moveDelay > 0) moveDelay--;

        if (gameState === 'playing') {
            if (keys['ArrowUp'] || keys['KeyW']) movePlayer(0, -1);
            else if (keys['ArrowDown'] || keys['KeyS']) movePlayer(0, 1);
            else if (keys['ArrowLeft'] || keys['KeyA']) movePlayer(-1, 0);
            else if (keys['ArrowRight'] || keys['KeyD']) movePlayer(1, 0);

            updateCars();
            checkCollisions();
        }

        updateParticles();

        ctx.clearRect(0, 0, W, H);
        drawBackground();
        drawToilet();
        drawCars();
        drawPlayer();
        drawParticles();
        updateHUD();

        animFrame = requestAnimationFrame(gameLoop);
    }

    // ===================== INPUT =====================

    document.addEventListener('keydown', function(e) {
        keys[e.code] = true;
        if (e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Space') {
            e.preventDefault();
        }
        if (e.code === 'Space' && gameState !== 'playing') {
            onStartClick();
        }
    });

    document.addEventListener('keyup', function(e) {
        keys[e.code] = false;
    });

    // Initial HUD
    updateHUD();
    </script>
</body>
</html>
